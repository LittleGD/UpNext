name: Fidelity Gate

# R7 (회귀 차단 CI 게이트) — 두 tier.
#
#  ┌─ BLOCKING (빠르고 결정적, 오늘 작동) ──────────────────────────────┐
#  │ guard       : structure-guard + icon-audit (condensed regression 차단) │
#  │ build-test  : iOS 빌드 + 단위/UI 테스트 (RetentionFlowUITests 회귀 잡음) │
#  └────────────────────────────────────────────────────────────────────┘
#  ┌─ INFORMATIONAL (무거움, baseline 캡처 필요 — 비차단) ─────────────────┐
#  │ fidelity-capture : 시각 pixelmatch + 사운드 FFT diff. PR 코멘트 + 아티팩트. │
#  │ nightly          : 풀 24행 캡처 (cron).                                │
#  └────────────────────────────────────────────────────────────────────┘
#
# 시각/모션/사운드 pixelmatch 는 docs/fidelity-grid.md 의 baseline 캡처가 선행돼야
# 차단 가능 (R0 baseline 미캡처 상태). 그때까지 continue-on-error 로 정보 제공만.
# BLOCKING tier 가 회복 산출물의 정적 무결성 + 빌드/테스트 회귀를 이미 차단한다.

on:
  pull_request:
    paths:
      - "upnext-ios/**"
      - "src/**"
      - "scripts/fidelity/**"
      - "docs/fidelity-grid.md"
      - ".github/workflows/fidelity-gate.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"  # daily 03:00 KST 풀 캡처

jobs:
  # ════════════════════════════════ BLOCKING ════════════════════════════════
  guard:
    name: Structure guard (condensed regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: icon audit (SF Symbol 화이트리스트)
        run: ./scripts/fidelity/icon-audit.sh
      - name: structure guard (회복 산출물 무결성)
        run: ./scripts/fidelity/structure-guard.sh

  build-test:
    name: iOS build + tests
    runs-on: macos-15
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode (>= 16 필수)
        run: |
          # UpNext.xcodeproj 는 objectVersion 77 (Xcode 16 의 파일시스템 동기화 그룹).
          # 15.x 로 열면 'Unable to read project' 로 죽는다. 예전엔 경로를 하드코딩하고
          # `|| true` 로 실패를 삼켜, 러너 이미지에서 Xcode_16.app 이 사라지자 15.4 로
          # 조용히 폴백해 빌드가 13초 만에 깨졌다. 실제 설치된 것 중 16+ 최신을 고르고
          # 없으면 큰 소리로 실패시킨다.
          BEST=""; BEST_V=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            V=$(/usr/bin/defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null) || continue
            case "${V%%.*}" in ''|*[!0-9]*) continue ;; esac
            [ "${V%%.*}" -ge 16 ] || continue
            if [ -z "$BEST" ] || [ "$(printf '%s\n%s\n' "$BEST_V" "$V" | sort -V | tail -1)" = "$V" ]; then
              BEST="$app"; BEST_V="$V"
            fi
          done
          if [ -z "$BEST" ]; then
            echo "::error::Xcode >= 16 not found on runner (project objectVersion 77 requires it)"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Selected: $BEST ($BEST_V)"
          sudo xcode-select -s "$BEST"
          xcodebuild -version
      - name: Build
        run: |
          cd upnext-ios/UpNext
          # device-agnostic 빌드 — 특정 시뮬레이터 이름 불필요 (Codex review P1).
          xcodebuild -project UpNext.xcodeproj -scheme UpNext \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/upnext-build build
      - name: Resolve simulator
        id: sim
        run: |
          # 러너 Xcode 에 실제 존재하는 iPhone 시뮬레이터를 동적 선택. iPhone 17 등
          # 특정 이름 하드코딩은 Xcode/러너 이미지 버전마다 깨짐 (Codex review P1).
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((v['udid'] for rt,ds in d['devices'].items() if 'iOS' in rt for v in ds if v.get('isAvailable') and 'iPhone' in v['name']), ''))")
          if [ -z "$UDID" ]; then echo "::error::no available iOS simulator on runner"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Resolved simulator UDID: $UDID"
      # 유닛 테스트는 차단 게이트 — 실제 로직 회귀를 잡는다.
      - name: Test (unit)
        run: |
          cd upnext-ios/UpNext
          xcodebuild test -project UpNext.xcodeproj -scheme UpNext \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath /tmp/upnext-build \
            -only-testing:UpNextTests

      # UI 테스트는 한시적 비차단.
      #
      # RetentionFlowUITests 는 iOS 26 시뮬레이터 런타임에서 앱 코드와 무관하게 깨진다.
      # xctrunner 자체가 뜨지 못하고("Simulator device failed to launch ...xctrunner",
      # CI 에선 "crashed with signal abrt before establishing connection") 그 뒤 케이스가
      # 연쇄로 실패한다.
      #
      # 앱 코드 탓이 아님을 대조 실행으로 확인했다 — 마지막으로 이 게이트가 초록이던
      # 97de12d 를 같은 시뮬레이터(iOS 26.2)에서 돌리면 5건 전부 실패한다. 그때 CI 가
      # 통과했던 건 러너에 Xcode 16.x 가 있어 옛 런타임에서 돌았기 때문이고, 그 Xcode 가
      # 이미지에서 사라져 26.3 으로 올라오면서 드러났다.
      #
      # 되돌리는 대신 신호를 유지한다: 유닛 테스트는 계속 차단하고, UI 는 결과만 남긴다.
      # 새 런타임에 맞게 수리한 뒤 continue-on-error 를 제거할 것.
      - name: Test (UI — 한시적 비차단, iOS 26 런타임 이슈)
        continue-on-error: true
        run: |
          cd upnext-ios/UpNext
          xcodebuild test -project UpNext.xcodeproj -scheme UpNext \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath /tmp/upnext-build \
            -only-testing:UpNextUITests

  # ═════════════════════════════ INFORMATIONAL ═════════════════════════════
  fidelity-capture:
    name: Fidelity diff (informational)
    runs-on: macos-15
    if: github.event_name == 'pull_request'
    continue-on-error: true   # baseline 미캡처 — 차단 아님, 정보 제공만
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Affected rows
        id: affected
        run: echo "rows=$(./scripts/fidelity/affected-rows.sh origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"

      - name: Setup deps
        run: |
          brew install ffmpeg jq || true
          pip3 install pixelmatch Pillow librosa numpy || true
          npm i -g playwright || true
          playwright install chromium || true

      - name: Build + boot + web
        run: |
          cd upnext-ios/UpNext
          xcodebuild -project UpNext.xcodeproj -scheme UpNext \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/upnext-build build
          cd "${GITHUB_WORKSPACE}"
          npm ci && (npm run dev &) && sleep 8
          # 가용 시뮬레이터 동적 부팅 (특정 이름 하드코딩 회피 — Codex review P1).
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((v['udid'] for rt,ds in d['devices'].items() if 'iOS' in rt for v in ds if v.get('isAvailable') and 'iPhone' in v['name']), ''))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl install "$UDID" \
            /tmp/upnext-build/Build/Products/Debug-iphonesimulator/UpNext.app

      - name: Capture affected rows
        run: |
          ROWS="${{ steps.affected.outputs.rows }}"
          [ -z "$ROWS" ] && ROWS="$(seq -w 1 24)"
          for row in $ROWS; do
            ./scripts/fidelity/snapshot-pair.sh "$row" || echo "row $row capture skipped"
          done

      - name: Fidelity diff + PR comment
        id: diff
        run: |
          set +e
          python3 scripts/fidelity/fidelity-diff.py --all | tee /tmp/fidelity-report.md
          {
            echo 'comment<<EOF'
            echo '### Fidelity Gate (informational — baseline 캡처 전)'
            echo '```'
            cat /tmp/fidelity-report.md 2>/dev/null || echo '(baseline 없음 — 캡처만 수행)'
            echo '```'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: ${{ steps.diff.outputs.comment }}

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-captures
          path: docs/fidelity/

  nightly:
    name: Fidelity nightly (full 24 rows)
    runs-on: macos-15
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup deps
        run: |
          brew install ffmpeg jq || true
          pip3 install pixelmatch Pillow librosa numpy || true
          npm i -g playwright || true
          playwright install chromium || true
      - name: Build + boot + web
        run: |
          cd upnext-ios/UpNext
          xcodebuild -project UpNext.xcodeproj -scheme UpNext \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/upnext-build build
          cd "${GITHUB_WORKSPACE}"
          npm ci && (npm run dev &) && sleep 8
          # 가용 시뮬레이터 동적 부팅 (특정 이름 하드코딩 회피 — Codex review P1).
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((v['udid'] for rt,ds in d['devices'].items() if 'iOS' in rt for v in ds if v.get('isAvailable') and 'iPhone' in v['name']), ''))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl install "$UDID" \
            /tmp/upnext-build/Build/Products/Debug-iphonesimulator/UpNext.app
      - name: Capture 24 rows
        run: for i in $(seq -w 1 24); do ./scripts/fidelity/snapshot-pair.sh "$i" || true; done
      - name: Upload nightly captures
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-nightly-${{ github.run_id }}
          path: docs/fidelity/

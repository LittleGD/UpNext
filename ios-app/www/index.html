<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>UpNext</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        text-align: center;
        max-width: 320px;
      }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        background: #171717;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #a3a3a3;
        line-height: 1.5;
      }
      .dots {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #525252;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes pulse {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="logo">U</div>
      <h1>UpNext</h1>
      <p>연결 중입니다. 네트워크 상태를 확인해 주세요.</p>
      <p>Reconnecting. Please check your network.</p>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </main>
    <!--
      server.errorPath 로 도착하는 오프라인/오류 폴백. 이 페이지는 Capacitor 플러그인에 접근할 수
      없으므로(안드로이드 errorPath 제약) 순수 JS 로만 원격 origin 재시도를 건다:
      online 이벤트 즉시, 첫 8초 뒤, 이후 20초 간격. navigator.onLine 이 명시적으로 false 면 건너뛴다.
    -->
    <script>
      (function () {
        var TARGET = "https://up-next-phi.vercel.app/";
        var OFFLINE_RETRY_FIRST_MS = 8000;
        var OFFLINE_RETRY_INTERVAL_MS = 20000;
        function go() {
          if (navigator.onLine === false) return;
          location.replace(TARGET);
        }
        window.addEventListener("online", go);
        setTimeout(go, OFFLINE_RETRY_FIRST_MS);
        setInterval(go, OFFLINE_RETRY_INTERVAL_MS);
      })();
    </script>
  </body>
</html>
